name: test

on:
  push:
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Test PDF'leri depoda tutulmaz; her koşuda yeniden üretilir.
      - run: npm run fixtures
      # Canlı site testi yayından SONRA ayrıca çalıştırılır (bkz. DURUM.md).
      - run: npx playwright test --grep-invert "canlı sitede"
