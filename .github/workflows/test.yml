name: test

on:
  push:
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            install: chromium
            env: ""
            args: ""
          - name: webkit
            install: webkit
            env: "PW_WEBKIT=1"
            args: "--project=webkit --project=iphone"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.install }}
      # Test PDF'leri depoda tutulmaz; her koşuda yeniden üretilir.
      - run: npm run fixtures
      # Canlı site testi yayından SONRA ayrıca çalıştırılır (bkz. DURUM.md).
      - run: ${{ matrix.env }} npx playwright test ${{ matrix.args }} --grep-invert "canlı sitede"
